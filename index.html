
<!DOCTYPE HTML>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STAR TAP - Arcade</title>

  <!-- YOUTUBE PLAYABLES SDK (FIRST MANDATORY SCRIPT) -->
  <script src="https://www.youtube.com/game_api/v1"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #020307;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      color: #fff;
    }

    /* MAIN GAME CONTAINER */
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #040714;
    }

    /* UNIVERSAL FRAME FOR ANY SCREEN IN LANDSCAPE (DESKTOP OR MOBILE) */
    @media (orientation: landscape) {
      #game-wrapper {
        width: min(100vw, calc(100vh * (420 / 720)));
        height: min(100vh, 880px);
        max-width: 480px;
        border: 2px solid #00e5ff;
        border-radius: 18px;
        box-shadow: 0 0 35px rgba(0, 229, 255, 0.25), 0 16px 45px rgba(0, 0, 0, 0.9);
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- TOP HUD BAR --- */
    #top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(58px + env(safe-area-inset-top, 0px));
      padding: max(8px, env(safe-area-inset-top, 8px)) 16px 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      background: linear-gradient(180deg, rgba(3, 5, 15, 0.96) 0%, rgba(3, 5, 15, 0.85) 75%, rgba(3, 5, 15, 0) 100%);
      pointer-events: none;
    }

    .hud-controls {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .hud-btn {
      background: #090e20;
      border: 2px solid #00e5ff;
      color: #00e5ff;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .hud-btn:hover {
      background: #00e5ff;
      color: #040714;
    }

    .hud-btn:active {
      transform: scale(0.94);
    }

    .hud-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    #live-score {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00e5ff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.7), 0 2px 4px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transition: opacity 0.2s ease;
      display: inline-block;
      pointer-events: none;
    }

    #live-score.show {
      opacity: 1;
    }

    /* --- SCREENS AND OVERLAYS --- */
    .ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 5, 14, 0.92);
      z-index: 30;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .ui-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ui-overlay.fading-out {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #start-screen {
      padding: calc(64px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      background: radial-gradient(circle at 50% 35%, rgba(0, 229, 255, 0.08) 0%, rgba(4, 7, 20, 0.96) 70%, #040714 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      margin-top: auto;
      margin-bottom: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: logoFloat 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes logoFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .logo-star-top {
      font-size: 48px;
      color: #ffd700;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
      margin-bottom: -6px;
      animation: starTwinkle 1.8s infinite ease-in-out;
    }

    @keyframes starTwinkle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(12deg); filter: drop-shadow(0 0 24px #ffd700); }
    }

    .logo-main {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1;
      display: block;
      color: #ffcc00;
      text-shadow: 3px 3px 0 #b35900, 0 0 20px rgba(255, 204, 0, 0.4);
    }

    .logo-sub {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 7px;
      display: block;
      color: #00e5ff;
      text-shadow: 3px 3px 0 #006699, 0 0 20px rgba(0, 229, 255, 0.5);
      margin-top: -6px;
    }

    .menu-bottom-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .best-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #090e20;
      border: 2px solid #ffd700;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffd700;
      margin-bottom: 16px;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.2);
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 240px;
      height: 54px;
      min-height: 48px;
      background: #00e5ff;
      color: #040714;
      border: 2px solid #00e5ff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .action-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .hints-card {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #7b8ea8;
      font-weight: 700;
    }

    .input-tags {
      display: flex;
      gap: 8px;
    }

    .tag {
      background: #0c1226;
      border: 1px solid #00e5ff;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #00e5ff;
    }

    .gameover-card {
      background: #080d20;
      border: 2px solid #00e5ff;
      border-radius: 18px;
      padding: 28px 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .gameover-title {
      font-size: 32px;
      font-weight: 900;
      color: #ff2a78;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .score-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .score-num {
      font-size: 64px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .score-lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #7085a6;
      margin-top: 8px;
    }

    .record-status {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #abbbcf;
    }

    .record-status.new-record {
      color: #ffd700;
    }

    .btn-secondary {
      background: #10162e;
      border: 2px solid #2e3d6b;
      color: #fff;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #182247;
      border-color: #00e5ff;
    }

    #ready-prompt {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 26;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.75);
    }

    #ready-prompt.active {
      opacity: 1;
      animation: pulseFloat 1.2s infinite ease-in-out;
    }

    .ready-tap-icon {
      font-size: 30px;
      filter: drop-shadow(0 0 10px #00e5ff);
    }

    @keyframes pulseFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-7px); }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="top-hud">
      <div id="live-score">Score: 0</div>
      <div class="hud-controls">
        <button id="pause-toggle" class="hud-btn" title="Pause / Resume (P)" aria-label="Pause">⏸</button>
        <button id="sound-toggle" class="hud-btn" title="Toggle Sound" aria-label="Sound Toggle">🔊</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ready-prompt">
      <span class="ready-tap-icon">👆</span>
      <span>TAP TO FLY!</span>
    </div>

    <div id="start-screen" class="ui-overlay active">
      <div class="logo-container">
        <div class="logo-star-top">★</div>
        <span class="logo-main">STAR</span>
        <span class="logo-sub">TAP</span>
      </div>

      <div class="menu-bottom-content">
        <div class="best-badge">
          <span>🏆 BEST SCORE:</span>
          <span id="menu-best-val">0</span>
        </div>

        <button id="start-btn" class="action-btn">
          <span>PLAY NOW</span>
          <span style="font-size: 16px;">▶</span>
        </button>

        <div class="hints-card">
          <div class="input-tags">
            <span class="tag">📱 TAP ANYWHERE</span>
            <span class="tag">⌨️ SPACEBAR</span>
          </div>
          <span>Bounce on walls & avoid spikes</span>
        </div>
      </div>
    </div>

    <div id="pause-screen" class="ui-overlay">
      <div class="gameover-card">
        <h2 class="gameover-title" style="color: #00e5ff;">PAUSED</h2>
        <div class="score-circle">
          <span class="score-num" id="pause-score-val" style="color: #00e5ff;">0</span>
          <span class="score-lbl">CURRENT SCORE</span>
        </div>
        <button id="resume-btn" class="action-btn" style="width: 100%;">RESUME</button>
        <button id="pause-restart-btn" class="action-btn btn-secondary" style="width: 100%;">RESTART</button>
      </div>
    </div>

    <div id="gameover-screen" class="ui-overlay">
      <div class="gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>
        <div class="score-circle">
          <span class="score-num" id="gameover-score-val">0</span>
          <span class="score-lbl">FINAL SCORE</span>
        </div>
        <div id="gameover-record-msg" class="record-status">BEST SCORE: 0</div>
        <button id="restart-btn" class="action-btn" style="width: 100%; background: #ff2a78; border-color: #ff2a78; color: #fff;">
          <span>TRY AGAIN</span>
          <span style="font-size: 18px; line-height: 1;">↻</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let platformPaused = false;
    let userPaused = false;
    let savedStateBeforePlatformPause = null;
    let isDataLoaded = false;
    let gameOverTimestamp = 0; // Prevents accidental clicks on Game Over

    /* --- CERTIFIED AUDIO SYSTEM --- */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.userMuted = false;
        this.platformMuted = false;
        this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      }

      get isMuted() {
        const isInsidePlayables = typeof ytgame !== 'undefined' && Boolean(ytgame.IN_PLAYABLES_ENV);
        return isInsidePlayables ? this.platformMuted : this.userMuted;
      }

      // ALWAYS initialize on the first human gesture to unlock mobile AudioContext
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.35, this.ctx.currentTime);
            this.masterGain.connect(this.ctx.destination);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended' && !this.isMuted && !platformPaused) {
          this.ctx.resume().catch(() => {});
        }
      }

      suspend() {
        if (this.ctx && this.ctx.state === 'running') {
          this.ctx.suspend().catch(() => {});
        }
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended' && !this.isMuted && !platformPaused) {
          this.ctx.resume().catch(() => {});
        }
      }

      setPlatformMute(isMuted) {
        this.platformMuted = Boolean(isMuted);
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.35, this.ctx.currentTime);
        }
        if (this.isMuted) {
          this.suspend();
        } else {
          this.resume();
        }
        this.updateUI();
      }

      toggleUserMute() {
        const isInsidePlayables = typeof ytgame !== 'undefined' && Boolean(ytgame.IN_PLAYABLES_ENV);
        if (isInsidePlayables) return;

        this.userMuted = !this.userMuted;
        this.init();

        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.35, this.ctx.currentTime);
        }
        if (!this.isMuted) this.resume();
        this.updateUI();
      }

      updateUI() {
        const btn = document.getElementById('sound-toggle');
        if (btn) {
          btn.textContent = this.isMuted ? '🔇' : '🔊';
          btn.title = this.isMuted ? 'Unmute Sound' : 'Mute Sound';
        }
      }

      playTone(freq, startOffset, duration, type = 'sine', gainVal = 0.2) {
        if (this.isMuted || platformPaused) return;
        this.init();
        if (!this.ctx || !this.masterGain) return;

        const now = this.ctx.currentTime + startOffset;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + duration);
      }

      playJump() {
        if (this.isMuted || platformPaused) return;
        this.init();
        if (!this.ctx || !this.masterGain) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.09);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      playBounce(currentScore) {
        if (this.isMuted || platformPaused) return;
        const note = this.scale[currentScore % this.scale.length];
        this.playTone(note, 0, 0.22, 'sine', 0.28);
      }

      playGem() {
        if (this.isMuted || platformPaused) return;
        this.playTone(987.77, 0, 0.12, 'sine', 0.16);
        this.playTone(1318.51, 0.07, 0.14, 'sine', 0.18);
      }

      playDie() {
        if (this.isMuted || platformPaused) return;
        this.playTone(320.00, 0, 0.24, 'sawtooth', 0.18);
        this.playTone(180.00, 0.1, 0.35, 'sawtooth', 0.18);
      }

      playRecord() {
        if (this.isMuted || platformPaused) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          this.playTone(freq, idx * 0.08, 0.24, 'sine', 0.22);
        });
      }
    }

    /* --- COORDINATES AND METRICS --- */
    const V_WIDTH = 400;
    let V_HEIGHT = 700;
    const WALL_THICK = 24;

    const TOP_HEADER_H = 70;
    let TOP_SPIKE_Y = TOP_HEADER_H + 24;
    let BOT_SPIKE_Y = V_HEIGHT - 65;

    const GRAVITY = 0.42;
    const JUMP_FORCE = -8.5;
    const BASE_SPEED_X = 4.4;

    const FIXED_STEP = 1 / 60;
    const MAX_ACCUMULATOR = 0.1;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = new SoundFX();

    const liveScoreEl = document.getElementById('live-score');
    const soundBtn = document.getElementById('sound-toggle');
    const pauseBtn = document.getElementById('pause-toggle');
    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const menuBestVal = document.getElementById('menu-best-val');
    const pauseScoreVal = document.getElementById('pause-score-val');
    const gameoverScoreVal = document.getElementById('gameover-score-val');
    const gameoverRecordMsg = document.getElementById('gameover-record-msg');
    const readyPrompt = document.getElementById('ready-prompt');

    const startBtn = document.getElementById('start-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');
    const pauseRestartBtn = document.getElementById('pause-restart-btn');

    let renderScale = 1;
    let animFrameId = null;

    const SLOT_COUNT = 9;
    let SLOT_HEIGHT = (BOT_SPIKE_Y - TOP_SPIKE_Y) / SLOT_COUNT;
    const SPIKE_DEPTH = 24;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);

      renderScale = canvas.width / V_WIDTH;
      V_HEIGHT = Math.round(canvas.height / renderScale);

      BOT_SPIKE_Y = V_HEIGHT - 65;
      SLOT_HEIGHT = (BOT_SPIKE_Y - TOP_SPIKE_Y) / SLOT_COUNT;

      if (state === 'READY' || state === 'START') {
        player.y = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2;
      }
    }
    window.addEventListener('resize', resizeCanvas);

    // Unlocks Web Audio on first user gesture even if audio is disabled by YouTube
    function wakeAudio() {
      audio.init();
    }
    window.addEventListener('pointerdown', wakeAudio, { once: true });
    window.addEventListener('keydown', wakeAudio, { once: true });

    /* BACKGROUND */
    const bgStars = [];
    for (let i = 0; i < 60; i++) {
      bgStars.push({
        x: Math.random() * V_WIDTH,
        y: Math.random() * 1000,
        size: Math.random() < 0.25 ? 2.5 : 1.5,
        alpha: Math.random() * 0.6 + 0.2,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#00e5ff' : '#ffe600')
      });
    }

    const bgConfetti = [];
    for (let i = 0; i < 20; i++) {
      bgConfetti.push({
        x: Math.random() * V_WIDTH,
        y: Math.random() * 1000,
        size: Math.random() * 3 + 2.5,
        rot: Math.random() * Math.PI,
        rotSpd: (Math.random() - 0.5) * 0.04,
        vy: (Math.random() * 0.4 + 0.15),
        color: ['#00e5ff', '#ff2a78', '#ffd700'][Math.floor(Math.random() * 3)],
        alpha: Math.random() * 0.4 + 0.3
      });
    }

    let state = 'START';
    let previousStateBeforePause = 'READY';
    let score = 0;
    let bestScore = 0;
    let screenShake = 0;
    let hoverTime = 0;
    let wallFlashLeft = 0;
    let wallFlashRight = 0;

    let player = {
      x: V_WIDTH / 2,
      y: V_HEIGHT / 2,
      vx: BASE_SPEED_X,
      vy: 0,
      radius: 21,
      trail: []
    };

    let leftSpikes = [];
    let rightSpikes = [];
    let gem = null;
    let particles = [];
    let tapRipples = [];

    function updateScreensUI() {
      startScreen.classList.toggle('active', state === 'START');
      pauseScreen.classList.toggle('active', state === 'PAUSED');
      gameoverScreen.classList.toggle('active', state === 'GAMEOVER');
      readyPrompt.classList.toggle('active', state === 'READY');

      liveScoreEl.classList.toggle('show', state === 'PLAY' || state === 'READY' || state === 'PAUSED');
      liveScoreEl.textContent = `Score: ${score}`;

      if (state === 'PLAY' || state === 'READY') {
        pauseBtn.textContent = '⏸';
        pauseBtn.disabled = false;
      } else if (state === 'PAUSED') {
        pauseBtn.textContent = '▶';
        pauseBtn.disabled = false;
        pauseScoreVal.textContent = score;
      } else {
        pauseBtn.textContent = '⏸';
        pauseBtn.disabled = true;
      }
    }

    // Comprehensive resume logic that safely restores gameplay state
    function resumeGame() {
      wakeAudio();
      userPaused = false;
      platformPaused = false;
      savedStateBeforePlatformPause = null;

      state = (previousStateBeforePause === 'READY' || previousStateBeforePause === 'PLAY')
        ? previousStateBeforePause
        : 'PLAY';

      lastFrameTime = performance.now();
      physicsAccumulator = 0;

      if (!animFrameId) {
        animFrameId = requestAnimationFrame(mainLoop);
      }

      updateScreensUI();
    }

    function togglePause(forcePause = null) {
      wakeAudio();

      if (forcePause === true || (forcePause === null && (state === 'PLAY' || state === 'READY'))) {
        userPaused = true;
        previousStateBeforePause = state;
        state = 'PAUSED';
        updateScreensUI();
      } else if (forcePause === false || (forcePause === null && state === 'PAUSED')) {
        resumeGame();
      }
    }

    function generateSpikes(side) {
      const activeSpikes = [];
      let count = 2;
      if (score >= 4) count = 3;
      if (score >= 10) count = 4;
      if (score >= 20) count = 5;
      if (score >= 35) count = 6;
      if (score >= 50) count = 7;

      const indices = [];
      while (indices.length < count) {
        const r = Math.floor(Math.random() * SLOT_COUNT);
        if (!indices.includes(r)) indices.push(r);
      }

      indices.forEach(i => {
        const y1 = TOP_SPIKE_Y + i * SLOT_HEIGHT;
        const y2 = y1 + SLOT_HEIGHT;
        const midY = (y1 + y2) / 2;
        if (side === 'left') {
          activeSpikes.push({
            p1: { x: WALL_THICK, y: y1 },
            p2: { x: WALL_THICK + SPIKE_DEPTH, y: midY },
            p3: { x: WALL_THICK, y: y2 }
          });
        } else {
          activeSpikes.push({
            p1: { x: V_WIDTH - WALL_THICK, y: y1 },
            p2: { x: V_WIDTH - WALL_THICK - SPIKE_DEPTH, y: midY },
            p3: { x: V_WIDTH - WALL_THICK, y: y2 }
          });
        }
      });

      return activeSpikes;
    }

    function spawnGem() {
      if (Math.random() < 0.7) {
        gem = {
          x: V_WIDTH * 0.3 + Math.random() * (V_WIDTH * 0.4),
          y: TOP_SPIKE_Y + 40 + Math.random() * (BOT_SPIKE_Y - TOP_SPIKE_Y - 80),
          size: 15,
          floatTime: 0
        };
      } else {
        gem = null;
      }
    }

    function emitParticles(x, y, color, count = 12, speed = 4) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 0.7 + 0.3) * speed;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: 0.028 + Math.random() * 0.02,
          size: 2.2 + Math.random() * 2.5,
          color
        });
      }
    }

    function spawnTapRipple(x, y) {
      tapRipples.push({ x, y, r: 6, alpha: 1.0 });
    }

    function distSqToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return (px - x1) ** 2 + (py - y1) ** 2;
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return (px - (x1 + t * (x2 - x1))) ** 2 + (py - (y1 + t * (y2 - y1))) ** 2;
    }

    function checkSpikeCollision(spike) {
      const colRadiusSq = (player.radius * 0.65) ** 2;
      const d1 = distSqToSegment(player.x, player.y, spike.p1.x, spike.p1.y, spike.p2.x, spike.p2.y);
      const d2 = distSqToSegment(player.x, player.y, spike.p2.x, spike.p2.y, spike.p3.x, spike.p3.y);
      return d1 < colRadiusSq || d2 < colRadiusSq;
    }

    async function saveHighScore(newRecord) {
      if (!isDataLoaded) return;

      bestScore = Math.max(bestScore, newRecord);
      menuBestVal.textContent = bestScore;

      const isInsidePlayables = typeof ytgame !== 'undefined' && Boolean(ytgame.IN_PLAYABLES_ENV);

      if (isInsidePlayables && ytgame.game?.saveData) {
        try {
          await ytgame.game.saveData(JSON.stringify({ bestScore }));
          if (ytgame.engagement?.sendScore) {
            ytgame.engagement.sendScore({ value: Math.floor(bestScore) });
          }
        } catch (err) {
          console.warn('YT Playables Save Error:', err);
        }
      } else if (!isInsidePlayables) {
        try {
          localStorage.setItem('star_tap_record', bestScore.toString());
        } catch (e) {}
      }
    }

    async function loadSavedData() {
      const isInsidePlayables = typeof ytgame !== 'undefined' && Boolean(ytgame.IN_PLAYABLES_ENV);

      if (isInsidePlayables && ytgame.game?.loadData) {
        try {
          const cloudDataStr = await ytgame.game.loadData();
          if (cloudDataStr) {
            const parsed = typeof cloudDataStr === 'string' ? JSON.parse(cloudDataStr) : cloudDataStr;
            if (parsed && typeof parsed.bestScore === 'number') {
              bestScore = parsed.bestScore;
            }
          }
        } catch (err) {
          console.warn('YT Playables Load Error:', err);
        }
      } else if (!isInsidePlayables) {
        try {
          bestScore = parseInt(localStorage.getItem('star_tap_record') || '0', 10);
        } catch (e) {
          bestScore = 0;
        }
      }
      isDataLoaded = true;
      menuBestVal.textContent = bestScore;
    }

    function triggerGameOver() {
      state = 'GAMEOVER';
      gameOverTimestamp = performance.now(); // Marks the exact moment of defeat
      screenShake = 16;
      audio.playDie();
      emitParticles(player.x, player.y, '#ff2a78', 26, 6);
      emitParticles(player.x, player.y, '#ffd700', 16, 4.5);

      gameoverScoreVal.textContent = score;

      if (score > bestScore) {
        saveHighScore(score);
        gameoverRecordMsg.textContent = '⭐ NEW PERSONAL BEST! ⭐';
        gameoverRecordMsg.className = 'record-status new-record';
        setTimeout(() => audio.playRecord(), 300);
      } else {
        gameoverRecordMsg.textContent = `BEST SCORE: ${bestScore}`;
        gameoverRecordMsg.className = 'record-status';
      }

      updateScreensUI();
    }

    function prepareReadyState() {
      if (state === 'READY' || platformPaused) return;

      wakeAudio();

      player.x = V_WIDTH / 2;
      player.y = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2;
      player.vx = BASE_SPEED_X;
      player.vy = 0;
      player.trail = [];
      score = 0;
      leftSpikes = [];
      rightSpikes = [];
      gem = null;
      particles = [];
      tapRipples = [];
      wallFlashLeft = 0;
      wallFlashRight = 0;
      hoverTime = 0;

      startScreen.classList.add('fading-out');
      pauseScreen.classList.add('fading-out');
      gameoverScreen.classList.add('fading-out');

      state = 'READY';
      updateScreensUI();

      setTimeout(() => {
        startScreen.classList.remove('active', 'fading-out');
        pauseScreen.classList.remove('active', 'fading-out');
        gameoverScreen.classList.remove('active', 'fading-out');
      }, 250);
    }

    function handleAction() {
      if (platformPaused) return;

      wakeAudio();

      if (state === 'START') {
        prepareReadyState();
      } else if (state === 'READY') {
        state = 'PLAY';
        player.vy = JUMP_FORCE;
        audio.playJump();
        spawnTapRipple(player.x, player.y + player.radius);
        emitParticles(player.x, player.y + player.radius, '#ffd700', 8, 3.2);
        updateScreensUI();
      } else if (state === 'PLAY') {
        player.vy = JUMP_FORCE;
        audio.playJump();
        spawnTapRipple(player.x, player.y + player.radius);
        emitParticles(player.x, player.y + player.radius, '#ffd700', 5, 2.5);
      } else if (state === 'PAUSED') {
        resumeGame();
      }
    }

    let lastSoundToggleTime = 0;
    function handleSoundToggle(e) {
      if (e) e.stopPropagation();
      const now = performance.now();
      if (now - lastSoundToggleTime < 250) return;
      lastSoundToggleTime = now;

      wakeAudio();
      audio.toggleUserMute();
    }

    soundBtn.addEventListener('pointerdown', handleSoundToggle);
    soundBtn.addEventListener('click', handleSoundToggle);

    let lastPauseToggleTime = 0;
    function handlePauseToggle(e) {
      if (e) e.stopPropagation();
      const now = performance.now();
      if (now - lastPauseToggleTime < 250) return;
      lastPauseToggleTime = now;

      togglePause();
    }

    pauseBtn.addEventListener('pointerdown', handlePauseToggle);
    pauseBtn.addEventListener('click', handlePauseToggle);

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      prepareReadyState();
    });

    let lastResumeActionTime = 0;
    function handleResumeBtn(e) {
      if (e) e.stopPropagation();
      const now = performance.now();
      if (now - lastResumeActionTime < 200) return;
      lastResumeActionTime = now;

      resumeGame();
    }

    resumeBtn.addEventListener('pointerdown', handleResumeBtn);
    resumeBtn.addEventListener('click', handleResumeBtn);

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (performance.now() - gameOverTimestamp < 350) return; // Debounce to prevent double clicks
      prepareReadyState();
    });

    pauseRestartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userPaused = false;
      prepareReadyState();
    });

    window.addEventListener('pointerdown', (e) => {
      // Ignore touches on buttons and top HUD
      if (e.target.closest('#top-hud') || e.target.closest('.ui-overlay.active button')) return;
      // On Game Over, never restart by clicking randomly on the screen (prevents accidental replay)
      if (state === 'GAMEOVER') return;
      handleAction();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        // Mandatory: DO NOT call preventDefault() on Escape
        if (state === 'PAUSED') {
          togglePause(false);
        } else if (state === 'PLAY' || state === 'READY') {
          togglePause(true);
        }
        return;
      }
      if (e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
        return;
      }
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (state === 'GAMEOVER') {
          if (performance.now() - gameOverTimestamp > 400) {
            prepareReadyState();
          }
          return;
        }
        handleAction();
      }
    });

    function drawCuteStar(x, y, radius, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (angle !== 0) ctx.rotate(angle);

      const spikes = 5;
      const outerR = radius * 1.25;
      const innerR = outerR * 0.5;
      let rot = -Math.PI / 2;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(0, -outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, -outerR, 0, outerR);
      grad.addColorStop(0, '#fff45c');
      grad.addColorStop(1, '#ffaa00');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#b86200';
      ctx.lineWidth = 3.2;
      ctx.stroke();

      ctx.save();
      ctx.clip();
      ctx.beginPath();
      ctx.ellipse(-radius * 0.35, -radius * 0.45, radius * 0.7, radius * 0.38, -Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ff3b7c';
      ctx.beginPath();
      ctx.arc(-radius * 0.5, radius * 0.16, radius * 0.16, 0, Math.PI * 2);
      ctx.arc(radius * 0.5, radius * 0.16, radius * 0.16, 0, Math.PI * 2);
      ctx.fill();

      const drawEye = (ex, ey) => {
        ctx.save();
        ctx.translate(ex, ey);
        ctx.fillStyle = '#0a0e1e';
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 0.14, radius * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-radius * 0.04, -radius * 0.08, radius * 0.07, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(radius * 0.04, radius * 0.07, radius * 0.035, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      drawEye(-radius * 0.28, -radius * 0.06);
      drawEye(radius * 0.28, -radius * 0.06);

      ctx.beginPath();
      ctx.arc(0, radius * 0.08, radius * 0.2, 0.15 * Math.PI, 0.85 * Math.PI, false);
      ctx.strokeStyle = '#0a0e1e';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
    }

    function tickFixedPhysics() {
      if (platformPaused || state === 'PAUSED') return;

      if (screenShake > 0) screenShake *= 0.88;
      if (screenShake < 0.2) screenShake = 0;

      if (wallFlashLeft > 0) wallFlashLeft -= 0.06;
      if (wallFlashRight > 0) wallFlashRight -= 0.06;

      for (let i = 0; i < bgConfetti.length; i++) {
        const c = bgConfetti[i];
        c.y += c.vy;
        c.rot += c.rotSpd;
        if (c.y > V_HEIGHT + 10) {
          c.y = -10;
          c.x = Math.random() * V_WIDTH;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = tapRipples.length - 1; i >= 0; i--) {
        const r = tapRipples[i];
        r.r += 2.4;
        r.alpha -= 0.045;
        if (r.alpha <= 0) tapRipples.splice(i, 1);
      }

      if (state === 'READY') {
        hoverTime += 0.05;
        player.y = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2 + Math.sin(hoverTime) * 4.5;
        return;
      }

      if (state !== 'PLAY') return;

      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      player.trail.unshift({ x: player.x, y: player.y, vx: player.vx, vy: player.vy });
      if (player.trail.length > 7) player.trail.pop();

      if (Math.random() < 0.4) {
        particles.push({
          x: player.x - (player.vx > 0 ? 14 : -14),
          y: player.y + (Math.random() - 0.5) * 8,
          vx: -player.vx * 0.2 + (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          life: 0.5,
          decay: 0.06,
          size: 2.5,
          color: '#ffd700'
        });
      }

      // Collision with Ceiling and Floor Spikes
      if (player.y - player.radius <= TOP_SPIKE_Y || player.y + player.radius >= BOT_SPIKE_Y) {
        triggerGameOver();
        return;
      }

      // Collision with Right Wall
      if (player.x + player.radius >= V_WIDTH - WALL_THICK) {
        player.x = V_WIDTH - WALL_THICK - player.radius;
        player.vx = -Math.abs(player.vx);
        wallFlashRight = 1.0;
        score++;
        liveScoreEl.textContent = `Score: ${score}`;
        audio.playBounce(score);
        emitParticles(player.x, player.y, '#00e5ff', 12, 4);
        rightSpikes = [];
        leftSpikes = generateSpikes('left');
        spawnGem();
      }

      // Collision with Left Wall
      if (player.x - player.radius <= WALL_THICK) {
        player.x = WALL_THICK + player.radius;
        player.vx = Math.abs(player.vx);
        wallFlashLeft = 1.0;
        score++;
        liveScoreEl.textContent = `Score: ${score}`;
        audio.playBounce(score);
        emitParticles(player.x, player.y, '#00e5ff', 12, 4);
        leftSpikes = [];
        rightSpikes = generateSpikes('right');
        spawnGem();
      }

      // Collision with Side Spikes
      const activeSpikes = player.vx > 0 ? rightSpikes : leftSpikes;
      for (let i = 0; i < activeSpikes.length; i++) {
        if (checkSpikeCollision(activeSpikes[i])) {
          triggerGameOver();
          return;
        }
      }

      // Star / Gem Collection
      if (gem) {
        gem.floatTime += 0.05;
        const hoverY = gem.y + Math.sin(gem.floatTime) * 3.5;
        const dx = player.x - gem.x;
        const dy = player.y - hoverY;
        if ((dx * dx + dy * dy) < (player.radius + gem.size) ** 2) {
          score += 3;
          liveScoreEl.textContent = `Score: ${score}`;
          audio.playGem();
          emitParticles(gem.x, hoverY, '#ffd700', 16, 4.5);
          emitParticles(gem.x, hoverY, '#00e5ff', 8, 3.5);
          gem = null;
        }
      }
    }

    function render() {
      if (canvas.width === 0 || canvas.height === 0) return;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#02040c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(renderScale, renderScale);

      if (screenShake > 0) {
        const ox = (Math.random() - 0.5) * screenShake;
        const oy = (Math.random() - 0.5) * screenShake;
        ctx.translate(ox, oy);
      }

      ctx.fillStyle = '#040714';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const now = performance.now() * 0.003;
      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        if (s.y > V_HEIGHT) s.y = Math.random() * V_HEIGHT;
        const a = s.alpha * (0.65 + 0.35 * Math.sin(now * s.twinkleSpeed * 8 + s.phase));
        ctx.fillStyle = s.color;
        ctx.globalAlpha = a;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1.0;

      for (let i = 0; i < bgConfetti.length; i++) {
        const c = bgConfetti[i];
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.globalAlpha = c.alpha;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
        ctx.restore();
      }
      ctx.globalAlpha = 1.0;

      if (state === 'PLAY' || state === 'PAUSED') {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.05)';
        ctx.font = '900 140px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(score, V_WIDTH / 2, (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2);
      }

      for (let i = 0; i < tapRipples.length; i++) {
        const r = tapRipples[i];
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = r.alpha;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();

        if (r.r > 12) {
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r * 0.65, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1.0;

      ctx.fillStyle = '#060a1a';
      ctx.fillRect(0, 0, WALL_THICK, V_HEIGHT);
      ctx.fillRect(V_WIDTH - WALL_THICK, 0, WALL_THICK, V_HEIGHT);

      const drawNeonRail = (x, flashAlpha) => {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        if (flashAlpha > 0) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${flashAlpha * 0.8})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(x, player.y - 30);
          ctx.lineTo(x, player.y + 30);
          ctx.stroke();
        }
      };

      drawNeonRail(WALL_THICK, wallFlashLeft);
      drawNeonRail(V_WIDTH - WALL_THICK, wallFlashRight);

      const spikeW = 20;
      const countSpikes = Math.ceil(V_WIDTH / spikeW);

      /* --- TOP SPIKES --- */
      ctx.fillStyle = '#1c0515';
      ctx.fillRect(0, 0, V_WIDTH, TOP_HEADER_H);

      ctx.fillStyle = '#8a0f43';
      ctx.strokeStyle = '#ff2a78';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(0, TOP_HEADER_H);
      for (let i = 0; i < countSpikes; i++) {
        const sx = i * spikeW;
        ctx.lineTo(sx + spikeW / 2, TOP_SPIKE_Y);
        ctx.lineTo(sx + spikeW, TOP_HEADER_H);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 42, 120, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, TOP_HEADER_H);
      ctx.lineTo(V_WIDTH, TOP_HEADER_H);
      ctx.stroke();

      /* --- BOTTOM SPIKES --- */
      const botBase = BOT_SPIKE_Y + 24;
      ctx.fillStyle = '#1c0515';
      ctx.fillRect(0, botBase, V_WIDTH, V_HEIGHT - botBase);

      ctx.fillStyle = '#8a0f43';
      ctx.strokeStyle = '#ff2a78';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(0, botBase);
      for (let i = 0; i < countSpikes; i++) {
        const sx = i * spikeW;
        ctx.lineTo(sx + spikeW / 2, BOT_SPIKE_Y);
        ctx.lineTo(sx + spikeW, botBase);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 42, 120, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, botBase);
      ctx.lineTo(V_WIDTH, botBase);
      ctx.stroke();

      /* --- SIDE SPIKES --- */
      const drawSpikesList = (list) => {
        if (list.length === 0) return;
        ctx.fillStyle = '#8a0f43';
        ctx.strokeStyle = '#ff2a78';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let i = 0; i < list.length; i++) {
          const sp = list[i];
          ctx.moveTo(sp.p1.x, sp.p1.y);
          ctx.lineTo(sp.p2.x, sp.p2.y);
          ctx.lineTo(sp.p3.x, sp.p3.y);
        }
        ctx.fill();
        ctx.stroke();
      };
      drawSpikesList(leftSpikes);
      drawSpikesList(rightSpikes);

      // Star Gem
      if (gem) {
        const hoverY = gem.y + Math.sin(gem.floatTime) * 3.5;
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gem.x - 12, hoverY + 4); ctx.lineTo(gem.x - 2, hoverY + 1);
        ctx.moveTo(gem.x - 16, hoverY + 9); ctx.lineTo(gem.x - 4, hoverY + 5);
        ctx.stroke();

        drawCuteStar(gem.x, hoverY, gem.size, 0);
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;

      // Player & Trail
      if (state !== 'GAMEOVER' && state !== 'START') {
        if (player.trail.length > 1) {
          ctx.strokeStyle = '#ffd700';
          ctx.lineCap = 'round';
          for (let i = 0; i < player.trail.length - 1; i++) {
            const p1 = player.trail[i];
            const p2 = player.trail[i + 1];
            ctx.globalAlpha = (1 - i / player.trail.length) * 0.55;
            ctx.lineWidth = 6 * (1 - i / player.trail.length);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;
        }

        const tilt = (state === 'READY') ? 0 : (player.vx * 0.04 + player.vy * 0.03);
        drawCuteStar(player.x, player.y, player.radius, tilt);
      }

      ctx.restore();
    }

    let lastFrameTime = performance.now();
    let physicsAccumulator = 0;

    function mainLoop(currentFrameTime) {
      if (platformPaused) return;

      let delta = (currentFrameTime - lastFrameTime) / 1000;
      lastFrameTime = currentFrameTime;

      if (delta > MAX_ACCUMULATOR) delta = MAX_ACCUMULATOR;
      physicsAccumulator += delta;

      while (physicsAccumulator >= FIXED_STEP) {
        tickFixedPhysics();
        physicsAccumulator -= FIXED_STEP;
      }

      render();
      animFrameId = requestAnimationFrame(mainLoop);
    }

    // Handles YouTube platform pause event (background tab, interstitial ad, or test suite)
    function handlePlatformPause() {
      platformPaused = true;
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      audio.suspend();

      if (state !== 'PAUSED') {
        savedStateBeforePlatformPause = state;
      }

      if (state === 'PLAY' || state === 'READY') {
        previousStateBeforePause = state;
        state = 'PAUSED';
      }

      updateScreensUI();

      if (isDataLoaded) {
        saveHighScore(bestScore);
      }
    }

    // Handles YouTube platform resume event
    function handlePlatformResume() {
      platformPaused = false;
      audio.resume();
      lastFrameTime = performance.now();
      physicsAccumulator = 0;

      // If the user did not manually open pause before, restore gameplay automatically
      if (!userPaused) {
        if (savedStateBeforePlatformPause) {
          state = savedStateBeforePlatformPause;
          savedStateBeforePlatformPause = null;
        } else if (state === 'PAUSED') {
          state = (previousStateBeforePause === 'READY' || previousStateBeforePause === 'PLAY')
            ? previousStateBeforePause
            : 'PLAY';
        }
      }

      if (!animFrameId) {
        animFrameId = requestAnimationFrame(mainLoop);
      }

      updateScreensUI();
    }

    /* --- 100% CERTIFIED INITIALIZATION --- */
    async function initYouTubePlayables() {
      resizeCanvas();
      updateScreensUI();
      render();

      const isInsidePlayables = typeof ytgame !== 'undefined' && Boolean(ytgame.IN_PLAYABLES_ENV);

      // 1. Hide custom audio button inside the YouTube environment
      if (isInsidePlayables && soundBtn) {
        soundBtn.style.display = 'none';
      }

      // 2. Notify first rendered frame
      if (typeof ytgame !== 'undefined' && ytgame.game?.firstFrameReady) {
        try {
          ytgame.game.firstFrameReady();
        } catch (e) {
          console.warn('firstFrameReady error:', e);
        }
      }

      // 3. REGISTER LISTENERS IMMEDIATELY (BEFORE LOAD DATA)
      if (isInsidePlayables && ytgame.system) {
        if (typeof ytgame.system.isAudioEnabled === 'function') {
          try {
            const isEnabled = ytgame.system.isAudioEnabled();
            if (typeof isEnabled === 'boolean') {
              audio.setPlatformMute(!isEnabled);
            }
          } catch (e) {
            console.warn('isAudioEnabled error:', e);
          }
        }

        if (typeof ytgame.system.onAudioEnabledChange === 'function') {
          try {
            ytgame.system.onAudioEnabledChange((enabled) => {
              if (typeof enabled === 'boolean') {
                audio.setPlatformMute(!enabled);
              }
            });
          } catch (e) {
            console.warn('onAudioEnabledChange error:', e);
          }
        }

        if (typeof ytgame.system.onPause === 'function') {
          ytgame.system.onPause(() => {
            handlePlatformPause();
          });
        }

        if (typeof ytgame.system.onResume === 'function') {
          ytgame.system.onResume(() => {
            handlePlatformResume();
          });
        }
      }

      audio.updateUI();

      // 4. Start render/graphics loop
      lastFrameTime = performance.now();
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(mainLoop);
      }

      // 5. Load saved cloud data
      await loadSavedData();

      // 6. Notify that the game is 100% interactive and ready
      if (typeof ytgame !== 'undefined' && ytgame.game?.gameReady) {
        try {
          ytgame.game.gameReady();
        } catch (e) {
          console.warn('gameReady error:', e);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', initYouTubePlayables);
  </script>
