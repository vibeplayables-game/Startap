<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STAR TAP - Arcade</title>

  <script src="https://www.youtube.com/game_api/v1"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #040714;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      color: #fff;
    }

    #game-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040714;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* TOP HUD BAR */
    #top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: max(8px, env(safe-area-inset-top, 8px)) max(16px, env(safe-area-inset-right, 16px)) 6px max(16px, env(safe-area-inset-left, 16px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      background: linear-gradient(180deg, rgba(4, 7, 20, 0.95) 0%, rgba(4, 7, 20, 0.5) 75%, transparent 100%);
      pointer-events: none;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .hud-btn {
      background: #090e20;
      border: 2px solid #00e5ff;
      color: #00e5ff;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .hud-btn:hover {
      background: #00e5ff;
      color: #040714;
    }

    .hud-btn:active {
      transform: scale(0.94);
    }

    .hud-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      pointer-events: none;
    }

    #live-score {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #live-score.show {
      opacity: 1;
    }

    /* SCREENS E OVERLAYS */
    .ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(4, 7, 20, 0.92);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 30;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      overflow-y: auto;
    }

    .ui-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .ui-overlay.fading-out {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #start-screen {
      padding: calc(60px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      background: radial-gradient(circle at 50% 40%, rgba(0, 229, 255, 0.12) 0%, rgba(4, 7, 20, 0.96) 70%, #040714 100%);
      justify-content: space-between;
    }

    .logo-container {
      margin-top: auto;
      margin-bottom: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: logoFloat 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes logoFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .logo-star-top {
      font-size: 48px;
      color: #ffd700;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.8));
      margin-bottom: -6px;
    }

    .logo-main {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1;
      color: #ffcc00;
      text-shadow: 3px 3px 0 #b35900, 0 0 24px rgba(255, 204, 0, 0.4);
    }

    .logo-sub {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 8px;
      color: #00e5ff;
      text-shadow: 3px 3px 0 #006699, 0 0 24px rgba(0, 229, 255, 0.5);
      margin-top: -6px;
    }

    .menu-bottom-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      margin-bottom: auto;
    }

    .best-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #090e20;
      border: 2px solid #ffd700;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffd700;
      margin-bottom: 16px;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.25);
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      min-height: 48px;
      background: #00e5ff;
      color: #040714;
      border: 2px solid #00e5ff;
      border-radius: 14px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .action-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .hints-card {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #7b8ea8;
      font-weight: 700;
      text-align: center;
    }

    .input-tags {
      display: flex;
      gap: 8px;
    }

    .tag {
      background: #0c1226;
      border: 1px solid #00e5ff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #00e5ff;
    }

    .gameover-card {
      background: #080d20;
      border: 2px solid #00e5ff;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 229, 255, 0.2);
    }

    .gameover-title {
      font-size: 28px;
      font-weight: 900;
      color: #ff2a78;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .score-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .score-num {
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .score-lbl {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #7085a6;
      margin-top: 6px;
    }

    .record-status {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 18px;
      color: #abbbcf;
    }

    .record-status.new-record {
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .btn-secondary {
      background: #10162e;
      border: 2px solid #2e3d6b;
      color: #fff;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #182247;
      border-color: #00e5ff;
    }

    #ready-prompt {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 26;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.75);
    }

    #ready-prompt.active {
      opacity: 1;
      animation: pulseFloat 1.2s infinite ease-in-out;
    }

    .ready-tap-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 10px #00e5ff);
    }

    @keyframes pulseFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-6px); }
    }

    /* ADAPTAÇÃO PARA MODO PAISAGEM (LANDSCAPE) */
    @media (orientation: landscape), (max-height: 520px) {
      #start-screen {
        flex-direction: row !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 36px !important;
        padding: max(12px, env(safe-area-inset-top, 12px)) max(24px, env(safe-area-inset-right, 24px)) max(12px, env(safe-area-inset-bottom, 12px)) max(24px, env(safe-area-inset-left, 24px)) !important;
      }

      .logo-container {
        margin: 0 !important;
        flex-shrink: 0;
      }

      .logo-star-top {
        font-size: 36px !important;
        margin-bottom: -4px !important;
      }

      .logo-main {
        font-size: 40px !important;
      }

      .logo-sub {
        font-size: 32px !important;
        letter-spacing: 6px !important;
        margin-top: -4px !important;
      }

      .menu-bottom-content {
        margin: 0 !important;
        max-width: 280px !important;
      }

      .best-badge {
        margin-bottom: 10px !important;
        padding: 4px 14px !important;
        font-size: 12px !important;
      }

      .action-btn {
        height: 48px !important;
        min-height: 48px !important;
        font-size: 15px !important;
      }

      .hints-card {
        margin-top: 8px !important;
        font-size: 11px !important;
        gap: 4px !important;
      }

      .hints-card span:last-child {
        display: none;
      }

      .gameover-card {
        padding: 14px 18px !important;
        max-width: 360px !important;
        border-radius: 16px !important;
      }

      .gameover-title {
        font-size: 20px !important;
        margin-bottom: 8px !important;
      }

      .score-circle {
        margin-bottom: 8px !important;
      }

      .score-num {
        font-size: 38px !important;
      }

      .score-lbl {
        font-size: 10px !important;
        margin-top: 2px !important;
      }

      .record-status {
        font-size: 12px !important;
        margin-bottom: 10px !important;
      }

      .btn-secondary {
        margin-top: 6px !important;
      }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div id="top-hud">
      <div id="live-score">Score: 0</div>
      <div class="hud-controls">
        <button id="pause-toggle" class="hud-btn" title="Pause / Resume" aria-label="Pause">⏸</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ready-prompt">
      <span class="ready-tap-icon">👆</span>
      <span>TAP TO FLY!</span>
    </div>

    <div id="start-screen" class="ui-overlay active">
      <div class="logo-container">
        <div class="logo-star-top">★</div>
        <span class="logo-main">STAR</span>
        <span class="logo-sub">TAP</span>
      </div>

      <div class="menu-bottom-content">
        <div class="best-badge">
          <span>🏆 BEST SCORE:</span>
          <span id="menu-best-val">0</span>
        </div>

        <button id="start-btn" class="action-btn">
          <span>PLAY NOW</span>
          <span style="font-size: 15px;">▶</span>
        </button>

        <div class="hints-card">
          <div class="input-tags">
            <span class="tag">📱 TAP ANYWHERE</span>
            <span class="tag">⌨️ SPACE</span>
          </div>
          <span>Bounce on walls & avoid spikes</span>
        </div>
      </div>
    </div>

    <div id="pause-screen" class="ui-overlay">
      <div class="gameover-card">
        <h2 class="gameover-title" style="color: #00e5ff;">PAUSED</h2>
        <div class="score-circle">
          <span class="score-num" id="pause-score-val" style="color: #00e5ff;">0</span>
          <span class="score-lbl">CURRENT SCORE</span>
        </div>
        <button id="resume-btn" class="action-btn">RESUME</button>
        <button id="pause-restart-btn" class="action-btn btn-secondary">RESTART</button>
      </div>
    </div>

    <div id="gameover-screen" class="ui-overlay">
      <div class="gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>
        <div class="score-circle">
          <span class="score-num" id="gameover-score-val">0</span>
          <span class="score-lbl">FINAL SCORE</span>
        </div>
        <div id="gameover-record-msg" class="record-status">BEST SCORE: 0</div>
        <button id="restart-btn" class="action-btn" style="background: #ff2a78; border-color: #ff2a78; color: #fff;">
          <span>TRY AGAIN</span>
          <span style="font-size: 17px; line-height: 1;">↻</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       PASSO 5: VERIFICAÇÃO DE AMBIENTE PLAYABLES
       ========================================================================== */
    const isPlayablesEnv = Boolean(window.ytgame && window.ytgame.IN_PLAYABLES_ENV);

    let platformPaused = false;
    let userPaused = false;
    let isDataLoaded = false;
    let isSavingProgress = false;
    let hasPendingSave = false;
    let userInteracted = false;
    let gameOverTimestamp = 0;
    let state = 'START';
    let savedStateBeforePause = null;
    let score = 0;
    let bestScore = 0;
    let recordSoundTimer = null;

    let animFrameId = null;
    let lastFrameTime = performance.now();
    let physicsAccumulator = 0;

    /* ==========================================================================
       PASSO 7: ÁUDIO COMPATÍVEL COM YOUTUBE PLAYABLES
       ========================================================================== */
    class PlayablesAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.audioEnabled = true;
        this.scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      }

      init() {
        if (!this.audioEnabled) return;
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.setValueAtTime(0.35, this.ctx.currentTime);
            this.masterGain.connect(this.ctx.destination);
          }
        }
        if (this.ctx && this.ctx.state === 'suspended' && !platformPaused && !userPaused) {
          this.ctx.resume().catch(() => {});
        }
      }

      setAudioEnabled(enabled) {
        this.audioEnabled = Boolean(enabled);
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.audioEnabled ? 0.35 : 0, this.ctx.currentTime);
        }
        if (this.audioEnabled) {
          if (userInteracted && !platformPaused && !userPaused) {
            this.resume();
          }
        } else {
          this.suspend();
        }
      }

      suspend() {
        if (this.ctx && this.ctx.state === 'running') {
          this.ctx.suspend().catch(() => {});
        }
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended' && this.audioEnabled && !platformPaused && !userPaused) {
          this.ctx.resume().catch(() => {});
        }
      }

      playTone(freq, startOffset, duration, type = 'sine', gainVal = 0.2) {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        this.init();
        if (!this.ctx || !this.masterGain) return;

        const now = this.ctx.currentTime + startOffset;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + duration);
      }

      playJump() {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        this.init();
        if (!this.ctx || !this.masterGain) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.09);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      playBounce(currentScore) {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        const note = this.scale[currentScore % this.scale.length];
        this.playTone(note, 0, 0.22, 'sine', 0.26);
      }

      playGem() {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        this.playTone(987.77, 0, 0.12, 'sine', 0.18);
        this.playTone(1318.51, 0.07, 0.14, 'sine', 0.2);
      }

      playDie() {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        this.playTone(320.00, 0, 0.24, 'sawtooth', 0.2);
        this.playTone(180.00, 0.1, 0.35, 'sawtooth', 0.2);
      }

      playRecord() {
        if (!this.audioEnabled || platformPaused || userPaused || !userInteracted) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          this.playTone(freq, idx * 0.08, 0.24, 'sine', 0.22);
        });
      }
    }

    const audio = new PlayablesAudioEngine();

    function wakeAudio() {
      userInteracted = true;
      audio.init();
    }
    window.addEventListener('pointerdown', wakeAudio, { once: true });
    window.addEventListener('keydown', wakeAudio, { once: true });

    /* ==========================================================================
       PASSO 10: SISTEMA RESPONSIVO (CANVAS & PROPORÇÕES)
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const liveScoreEl = document.getElementById('live-score');
    const pauseBtn = document.getElementById('pause-toggle');
    const startScreen = document.getElementById('start-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const menuBestVal = document.getElementById('menu-best-val');
    const pauseScoreVal = document.getElementById('pause-score-val');
    const gameoverScoreVal = document.getElementById('gameover-score-val');
    const gameoverRecordMsg = document.getElementById('gameover-record-msg');
    const readyPrompt = document.getElementById('ready-prompt');

    const startBtn = document.getElementById('start-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');
    const pauseRestartBtn = document.getElementById('pause-restart-btn');

    let renderScale = 1;
    let V_WIDTH = 400;
    const V_HEIGHT = 800;
    let arenaWidth = 400;
    let arenaLeft = 0;
    let arenaRight = 400;

    const WALL_THICK = 24;
    const TOP_HEADER_H = 80;
    const TOP_SPIKE_Y = TOP_HEADER_H + 24;
    const BOT_SPIKE_Y = V_HEIGHT - 75;

    const SLOT_COUNT = 9;
    const SLOT_HEIGHT = (BOT_SPIKE_Y - TOP_SPIKE_Y) / SLOT_COUNT;
    const SPIKE_DEPTH = 24;

    const GRAVITY = 0.42;
    const JUMP_FORCE = -8.5;
    const BASE_SPEED_X = 4.5;
    const FIXED_STEP = 1 / 60;
    const MAX_ACCUMULATOR = 0.1;

    let hoverBaseY = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2;

    function resizeCanvas() {
      const w = window.innerWidth || document.documentElement.clientWidth || 360;
      const h = window.innerHeight || document.documentElement.clientHeight || 640;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);

      renderScale = canvas.height / V_HEIGHT;
      V_WIDTH = Math.round(canvas.width / renderScale);

      arenaWidth = Math.min(V_WIDTH, 480);
      arenaLeft = Math.round((V_WIDTH - arenaWidth) / 2);
      arenaRight = arenaLeft + arenaWidth;

      if (state === 'START' || (state === 'READY' && score === 0)) {
        player.x = (arenaLeft + arenaRight) / 2;
        player.y = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2;
        hoverBaseY = player.y;
      }

      if (userPaused || platformPaused || state === 'PAUSED') {
        render();
      }
    }
    window.addEventListener('resize', resizeCanvas);

    /* CENÁRIO E PARTÍCULAS */
    const bgStars = [];
    for (let i = 0; i < 75; i++) {
      bgStars.push({
        x: Math.random() * 2000,
        y: Math.random() * V_HEIGHT,
        size: Math.random() < 0.25 ? 2.5 : 1.5,
        alpha: Math.random() * 0.6 + 0.2,
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#00e5ff' : '#ffe600')
      });
    }

    const bgConfetti = [];
    for (let i = 0; i < 24; i++) {
      bgConfetti.push({
        x: Math.random() * 2000,
        y: Math.random() * V_HEIGHT,
        size: Math.random() * 3 + 2.5,
        rot: Math.random() * Math.PI,
        rotSpd: (Math.random() - 0.5) * 0.04,
        vy: (Math.random() * 0.4 + 0.15),
        color: ['#00e5ff', '#ff2a78', '#ffd700'][Math.floor(Math.random() * 3)],
        alpha: Math.random() * 0.4 + 0.3
      });
    }

    let screenShake = 0;
    let hoverTime = 0;
    let wallFlashLeft = 0;
    let wallFlashRight = 0;

    let player = {
      x: 200,
      y: 400,
      vx: BASE_SPEED_X,
      vy: 0,
      radius: 21,
      trail: []
    };

    let leftSpikeSlots = [];
    let rightSpikeSlots = [];
    let gem = null;
    let particles = [];
    let tapRipples = [];

    function updateScreensUI() {
      startScreen.classList.toggle('active', state === 'START');
      pauseScreen.classList.toggle('active', state === 'PAUSED');
      gameoverScreen.classList.toggle('active', state === 'GAMEOVER');
      readyPrompt.classList.toggle('active', state === 'READY');

      if (state === 'READY') {
        if (player.y > 520) {
          readyPrompt.style.top = '35%';
        } else {
          readyPrompt.style.top = '60%';
        }
      }

      liveScoreEl.classList.toggle('show', state === 'PLAY' || state === 'READY' || state === 'PAUSED');
      liveScoreEl.textContent = `Score: ${score}`;

      if (state === 'PLAY' || state === 'READY') {
        pauseBtn.textContent = '⏸';
        pauseBtn.disabled = false;
      } else if (state === 'PAUSED') {
        pauseBtn.textContent = '▶';
        pauseBtn.disabled = false;
        pauseScoreVal.textContent = score;
      } else {
        pauseBtn.textContent = '⏸';
        pauseBtn.disabled = true;
      }
    }

    /* ==========================================================================
       PASSO 6: GERENCIAMENTO ESTRITO DE PAUSE E RESUME
       ========================================================================== */
    function pausarLogicaJogo(origem = 'user') {
      if (origem === 'system') {
        platformPaused = true;
      } else {
        userPaused = true;
      }

      if (recordSoundTimer) {
        clearTimeout(recordSoundTimer);
        recordSoundTimer = null;
      }

      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }

      audio.suspend();

      // Preserva o estado original antes de pausar
      if (state !== 'PAUSED') {
        savedStateBeforePause = state;
        if (state === 'PLAY' || state === 'READY') {
          state = 'PAUSED';
        }
      }

      physicsAccumulator = 0;
      lastFrameTime = performance.now();

      updateScreensUI();
      render();
    }

    function retomarLogicaJogo(origem = 'user') {
      wakeAudio();

      if (origem === 'system') {
        platformPaused = false;
      } else {
        userPaused = false;
      }

      // Só retoma se tanto o usuário quanto a plataforma permitirem
      if (!platformPaused && !userPaused) {
        // CORREÇÃO: Volta sempre no estado READY (parado flutuando no ar) com o aviso TAP TO FLY
        // mantendo posição, espinhos e score intactos!
        if (savedStateBeforePause === 'PLAY' || state === 'PAUSED') {
          state = 'READY';
          const minY = TOP_SPIKE_Y + player.radius + 16;
          const maxY = BOT_SPIKE_Y - player.radius - 16;
          hoverBaseY = Math.max(minY, Math.min(maxY, player.y));
          player.y = hoverBaseY;
          player.vy = 0;
          hoverTime = 0;
          player.trail = [];
        } else if (savedStateBeforePause) {
          state = savedStateBeforePause;
        }

        savedStateBeforePause = null;
        audio.resume();

        lastFrameTime = performance.now();
        physicsAccumulator = 0;

        if (!animFrameId) {
          animFrameId = requestAnimationFrame(mainLoop);
        }

        updateScreensUI();
      }
    }

    function togglePause(forcePause = null) {
      wakeAudio();
      if (forcePause === true || (forcePause === null && (state === 'PLAY' || state === 'READY'))) {
        pausarLogicaJogo('user');
      } else if (forcePause === false || (forcePause === null && state === 'PAUSED')) {
        retomarLogicaJogo('user');
      }
    }

    function generateSpikeSlots() {
      const slots = [];
      let count = 2;
      if (score >= 4) count = 3;
      if (score >= 10) count = 4;
      if (score >= 20) count = 5;
      if (score >= 35) count = 6;
      if (score >= 50) count = 7;

      while (slots.length < count) {
        const r = Math.floor(Math.random() * SLOT_COUNT);
        if (!slots.includes(r)) slots.push(r);
      }
      return slots;
    }

    function spawnGem() {
      if (Math.random() < 0.7) {
        gem = {
          relX: 0.2 + Math.random() * 0.6,
          relY: 0.15 + Math.random() * 0.7,
          size: 15,
          floatTime: 0
        };
      } else {
        gem = null;
      }
    }

    function emitParticles(x, y, color, count = 12, speed = 4) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 0.7 + 0.3) * speed;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: 0.028 + Math.random() * 0.02,
          size: 2.2 + Math.random() * 2.5,
          color
        });
      }
    }

    function spawnTapRipple(x, y) {
      tapRipples.push({ x, y, r: 6, alpha: 1.0 });
    }

    function distSqToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return (px - x1) ** 2 + (py - y1) ** 2;
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return (px - (x1 + t * (x2 - x1))) ** 2 + (py - (y1 + t * (y2 - y1))) ** 2;
    }

    function checkSpikeSlotCollision(side, slotIndex) {
      const leftWallX = arenaLeft + WALL_THICK;
      const rightWallX = arenaRight - WALL_THICK;
      const y1 = TOP_SPIKE_Y + slotIndex * SLOT_HEIGHT;
      const y2 = y1 + SLOT_HEIGHT;
      const midY = (y1 + y2) / 2;

      let p1, p2, p3;
      if (side === 'left') {
        p1 = { x: leftWallX, y: y1 };
        p2 = { x: leftWallX + SPIKE_DEPTH, y: midY };
        p3 = { x: leftWallX, y: y2 };
      } else {
        p1 = { x: rightWallX, y: y1 };
        p2 = { x: rightWallX - SPIKE_DEPTH, y: midY };
        p3 = { x: rightWallX, y: y2 };
      }

      const colRadiusSq = (player.radius * 0.65) ** 2;
      const d1 = distSqToSegment(player.x, player.y, p1.x, p1.y, p2.x, p2.y);
      const d2 = distSqToSegment(player.x, player.y, p2.x, p2.y, p3.x, p3.y);
      return d1 < colRadiusSq || d2 < colRadiusSq;
    }

    /* ==========================================================================
       PASSOS 8 & 9: PERSISTÊNCIA NA NUVEM E PLACAR NATIVO
       ========================================================================== */
    async function submitScoreToYouTube(val) {
      const integerScore = Math.max(0, Math.floor(Number(val) || 0));
      if (typeof ytgame !== 'undefined' && ytgame.engagement?.sendScore) {
        try {
          await ytgame.engagement.sendScore({ value: integerScore });
        } catch (err) {
          console.warn('Falha ao enviar score para YouTube Playables:', err);
        }
      }
    }

    async function saveHighScore(newRecord) {
      if (!isDataLoaded) return;
      bestScore = Math.max(bestScore, Math.floor(newRecord));
      menuBestVal.textContent = bestScore;
      gameoverRecordMsg.textContent = `BEST SCORE: ${bestScore}`;

      if (isSavingProgress) {
        hasPendingSave = true;
        return;
      }

      isSavingProgress = true;
      try {
        if (typeof ytgame !== 'undefined' && ytgame.game?.saveData) {
          await ytgame.game.saveData(JSON.stringify({ bestScore }));
        } else {
          try { localStorage.setItem('startap_best', String(bestScore)); } catch (_) {}
        }
        await submitScoreToYouTube(bestScore);
      } catch (err) {
        console.warn('Erro ao salvar dados no YouTube Playables:', err);
      } finally {
        isSavingProgress = false;
        if (hasPendingSave) {
          hasPendingSave = false;
          saveHighScore(bestScore);
        }
      }
    }

    async function loadSavedData() {
      if (typeof ytgame !== 'undefined' && ytgame.game?.loadData) {
        try {
          const loadPromise = ytgame.game.loadData();
          const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve(null), 3000));
          const cloudData = await Promise.race([loadPromise, timeoutPromise]);

          if (cloudData) {
            let parsed = null;
            if (typeof cloudData === 'string' && cloudData.trim().length > 0) {
              try {
                parsed = JSON.parse(cloudData);
              } catch (_) {}
            } else if (typeof cloudData === 'object') {
              parsed = cloudData;
            }

            if (parsed && typeof parsed.bestScore === 'number' && Number.isFinite(parsed.bestScore)) {
              bestScore = Math.max(0, Math.floor(parsed.bestScore));
            }
          }
        } catch (err) {
          console.warn('Erro ao carregar dados do YouTube Playables:', err);
        }
      }

      if (bestScore === 0) {
        try {
          const local = localStorage.getItem('startap_best');
          if (local) bestScore = Math.max(0, parseInt(local, 10) || 0);
        } catch (_) {}
      }

      isDataLoaded = true;
      menuBestVal.textContent = bestScore;
      gameoverRecordMsg.textContent = `BEST SCORE: ${bestScore}`;
    }

    function triggerGameOver() {
      state = 'GAMEOVER';
      gameOverTimestamp = performance.now();
      screenShake = 16;
      audio.playDie();
      emitParticles(player.x, player.y, '#ff2a78', 26, 6);
      emitParticles(player.x, player.y, '#ffd700', 16, 4.5);

      gameoverScoreVal.textContent = score;

      if (score > bestScore) {
        saveHighScore(score);
        gameoverRecordMsg.textContent = '⭐ NEW PERSONAL BEST! ⭐';
        gameoverRecordMsg.className = 'record-status new-record';
        recordSoundTimer = setTimeout(() => {
          if (!platformPaused && !userPaused) audio.playRecord();
        }, 300);
      } else {
        gameoverRecordMsg.textContent = `BEST SCORE: ${bestScore}`;
        gameoverRecordMsg.className = 'record-status';
      }

      updateScreensUI();
    }

    function prepareReadyState() {
      if (platformPaused) return;

      userPaused = false;
      savedStateBeforePause = null;

      wakeAudio();
      audio.resume();

      player.x = (arenaLeft + arenaRight) / 2;
      hoverBaseY = (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2;
      player.y = hoverBaseY;
      player.vx = BASE_SPEED_X;
      player.vy = 0;
      player.trail = [];
      score = 0;
      leftSpikeSlots = [];
      rightSpikeSlots = [];
      gem = null;
      particles = [];
      tapRipples = [];
      wallFlashLeft = 0;
      wallFlashRight = 0;
      hoverTime = 0;

      startScreen.classList.add('fading-out');
      pauseScreen.classList.add('fading-out');
      gameoverScreen.classList.add('fading-out');

      state = 'READY';
      updateScreensUI();

      setTimeout(() => {
        startScreen.classList.remove('active', 'fading-out');
        pauseScreen.classList.remove('active', 'fading-out');
        gameoverScreen.classList.remove('active', 'fading-out');
      }, 200);

      lastFrameTime = performance.now();
      physicsAccumulator = 0;
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(mainLoop);
      }
      render();
    }

    function handleAction() {
      if (platformPaused || userPaused) return;

      wakeAudio();

      if (state === 'START') {
        prepareReadyState();
      } else if (state === 'READY') {
        state = 'PLAY';
        player.vy = JUMP_FORCE;
        audio.playJump();
        spawnTapRipple(player.x, player.y + player.radius);
        emitParticles(player.x, player.y + player.radius, '#ffd700', 8, 3.2);
        updateScreensUI();
      } else if (state === 'PLAY') {
        player.vy = JUMP_FORCE;
        audio.playJump();
        spawnTapRipple(player.x, player.y + player.radius);
        emitParticles(player.x, player.y + player.radius, '#ffd700', 5, 2.5);
      } else if (state === 'PAUSED') {
        retomarLogicaJogo('user');
      }
    }

    pauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePause();
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      prepareReadyState();
    });

    resumeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      retomarLogicaJogo('user');
    });

    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (performance.now() - gameOverTimestamp < 350) return;
      prepareReadyState();
    });

    pauseRestartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      userPaused = false;
      prepareReadyState();
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#top-hud') || e.target.closest('.ui-overlay.active button')) return;
      if (state === 'GAMEOVER') return;
      handleAction();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        if (state === 'PAUSED') {
          retomarLogicaJogo('user');
        } else if (state === 'PLAY' || state === 'READY') {
          pausarLogicaJogo('user');
        }
        return;
      }

      if (e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
        return;
      }

      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (state === 'GAMEOVER') {
          if (performance.now() - gameOverTimestamp > 400) {
            prepareReadyState();
          }
          return;
        }
        handleAction();
      }
    });

    if (!isPlayablesEnv) {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          pausarLogicaJogo('system');
        } else {
          retomarLogicaJogo('system');
        }
      });
    }

    function drawCuteStar(x, y, radius, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (angle !== 0) ctx.rotate(angle);

      const spikes = 5;
      const outerR = radius * 1.25;
      const innerR = outerR * 0.5;
      let rot = -Math.PI / 2;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(0, -outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(Math.cos(rot) * outerR, Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(Math.cos(rot) * innerR, Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, -outerR, 0, outerR);
      grad.addColorStop(0, '#fff45c');
      grad.addColorStop(1, '#ffaa00');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#b86200';
      ctx.lineWidth = 3.2;
      ctx.stroke();

      ctx.save();
      ctx.clip();
      ctx.beginPath();
      ctx.ellipse(-radius * 0.35, -radius * 0.45, radius * 0.7, radius * 0.38, -Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ff3b7c';
      ctx.beginPath();
      ctx.arc(-radius * 0.5, radius * 0.16, radius * 0.16, 0, Math.PI * 2);
      ctx.arc(radius * 0.5, radius * 0.16, radius * 0.16, 0, Math.PI * 2);
      ctx.fill();

      const drawEye = (ex, ey) => {
        ctx.save();
        ctx.translate(ex, ey);
        ctx.fillStyle = '#0a0e1e';
        ctx.beginPath();
        ctx.ellipse(0, 0, radius * 0.14, radius * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-radius * 0.04, -radius * 0.08, radius * 0.07, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(radius * 0.04, radius * 0.07, radius * 0.035, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      drawEye(-radius * 0.28, -radius * 0.06);
      drawEye(radius * 0.28, -radius * 0.06);

      ctx.beginPath();
      ctx.arc(0, radius * 0.08, radius * 0.2, 0.15 * Math.PI, 0.85 * Math.PI, false);
      ctx.strokeStyle = '#0a0e1e';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
    }

    function tickFixedPhysics() {
      if (platformPaused || userPaused || state === 'PAUSED') return;

      if (screenShake > 0) screenShake *= 0.88;
      if (screenShake < 0.2) screenShake = 0;

      if (wallFlashLeft > 0) wallFlashLeft -= 0.06;
      if (wallFlashRight > 0) wallFlashRight -= 0.06;

      for (let i = 0; i < bgConfetti.length; i++) {
        const c = bgConfetti[i];
        c.y += c.vy;
        c.rot += c.rotSpd;
        if (c.y > V_HEIGHT + 10) {
          c.y = -10;
          c.x = Math.random() * V_WIDTH;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = tapRipples.length - 1; i >= 0; i--) {
        const r = tapRipples[i];
        r.r += 2.4;
        r.alpha -= 0.045;
        if (r.alpha <= 0) tapRipples.splice(i, 1);
      }

      if (state === 'READY') {
        hoverTime += 0.05;
        player.y = hoverBaseY + Math.sin(hoverTime) * 4.5;
        return;
      }

      if (state !== 'PLAY') return;

      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      player.trail.unshift({ x: player.x, y: player.y });
      if (player.trail.length > 7) player.trail.pop();

      if (Math.random() < 0.4) {
        particles.push({
          x: player.x - (player.vx > 0 ? 14 : -14),
          y: player.y + (Math.random() - 0.5) * 8,
          vx: -player.vx * 0.2 + (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          life: 0.5,
          decay: 0.06,
          size: 2.5,
          color: '#ffd700'
        });
      }

      if (player.y - player.radius <= TOP_SPIKE_Y || player.y + player.radius >= BOT_SPIKE_Y) {
        triggerGameOver();
        return;
      }

      const leftWallX = arenaLeft + WALL_THICK;
      const rightWallX = arenaRight - WALL_THICK;

      if (player.x + player.radius >= rightWallX) {
        player.x = rightWallX - player.radius;
        player.vx = -Math.abs(player.vx);
        wallFlashRight = 1.0;
        score++;
        liveScoreEl.textContent = `Score: ${score}`;
        audio.playBounce(score);
        emitParticles(player.x, player.y, '#00e5ff', 12, 4);
        rightSpikeSlots = [];
        leftSpikeSlots = generateSpikeSlots();
        spawnGem();
      }

      if (player.x - player.radius <= leftWallX) {
        player.x = leftWallX + player.radius;
        player.vx = Math.abs(player.vx);
        wallFlashLeft = 1.0;
        score++;
        liveScoreEl.textContent = `Score: ${score}`;
        audio.playBounce(score);
        emitParticles(player.x, player.y, '#00e5ff', 12, 4);
        leftSpikeSlots = [];
        rightSpikeSlots = generateSpikeSlots();
        spawnGem();
      }

      if (player.vx > 0) {
        for (let i = 0; i < rightSpikeSlots.length; i++) {
          if (checkSpikeSlotCollision('right', rightSpikeSlots[i])) {
            triggerGameOver();
            return;
          }
        }
      } else {
        for (let i = 0; i < leftSpikeSlots.length; i++) {
          if (checkSpikeSlotCollision('left', leftSpikeSlots[i])) {
            triggerGameOver();
            return;
          }
        }
      }

      if (gem) {
        gem.floatTime += 0.05;
        const gemRealX = leftWallX + gem.relX * (rightWallX - leftWallX);
        const gemRealY = TOP_SPIKE_Y + 40 + gem.relY * (BOT_SPIKE_Y - TOP_SPIKE_Y - 80) + Math.sin(gem.floatTime) * 3.5;

        const dx = player.x - gemRealX;
        const dy = player.y - gemRealY;
        if ((dx * dx + dy * dy) < (player.radius + gem.size) ** 2) {
          score += 3;
          liveScoreEl.textContent = `Score: ${score}`;
          audio.playGem();
          emitParticles(gemRealX, gemRealY, '#ffd700', 16, 4.5);
          emitParticles(gemRealX, gemRealY, '#00e5ff', 8, 3.5);
          gem = null;
        }
      }
    }

    function render() {
      if (canvas.width === 0 || canvas.height === 0) return;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#02040c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.scale(renderScale, renderScale);

      if (screenShake > 0) {
        const ox = (Math.random() - 0.5) * screenShake;
        const oy = (Math.random() - 0.5) * screenShake;
        ctx.translate(ox, oy);
      }

      ctx.fillStyle = '#040714';
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      const now = performance.now() * 0.003;
      for (let i = 0; i < bgStars.length; i++) {
        const s = bgStars[i];
        const sX = s.x % V_WIDTH;
        const a = s.alpha * (0.65 + 0.35 * Math.sin(now * s.twinkleSpeed * 8 + s.phase));
        ctx.fillStyle = s.color;
        ctx.globalAlpha = a;
        ctx.fillRect(sX, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1.0;

      for (let i = 0; i < bgConfetti.length; i++) {
        const c = bgConfetti[i];
        const cX = c.x % V_WIDTH;
        ctx.save();
        ctx.translate(cX, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.globalAlpha = c.alpha;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
        ctx.restore();
      }
      ctx.globalAlpha = 1.0;

      if (state === 'PLAY' || state === 'PAUSED' || (state === 'READY' && score > 0)) {
        ctx.fillStyle = 'rgba(0, 229, 255, 0.06)';
        ctx.font = '900 150px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(score, (arenaLeft + arenaRight) / 2, (TOP_SPIKE_Y + BOT_SPIKE_Y) / 2);
      }

      for (let i = 0; i < tapRipples.length; i++) {
        const r = tapRipples[i];
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = r.alpha;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1.0;

      const leftWallX = arenaLeft + WALL_THICK;
      const rightWallX = arenaRight - WALL_THICK;

      ctx.fillStyle = '#060a1a';
      ctx.fillRect(arenaLeft, 0, WALL_THICK, V_HEIGHT);
      ctx.fillRect(rightWallX, 0, WALL_THICK, V_HEIGHT);

      const drawNeonRail = (x, flashAlpha) => {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT);
        ctx.stroke();

        if (flashAlpha > 0) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${flashAlpha * 0.8})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(x, player.y - 30);
          ctx.lineTo(x, player.y + 30);
          ctx.stroke();
        }
      };

      drawNeonRail(leftWallX, wallFlashLeft);
      drawNeonRail(rightWallX, wallFlashRight);

      const spikeW = 20;
      const arenaSpikeCount = Math.ceil((arenaRight - arenaLeft) / spikeW);

      /* TOPO */
      ctx.fillStyle = '#1c0515';
      ctx.fillRect(0, 0, V_WIDTH, TOP_HEADER_H);

      ctx.fillStyle = '#8a0f43';
      ctx.strokeStyle = '#ff2a78';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(arenaLeft, TOP_HEADER_H);
      for (let i = 0; i < arenaSpikeCount; i++) {
        const sx = arenaLeft + i * spikeW;
        ctx.lineTo(sx + spikeW / 2, TOP_SPIKE_Y);
        ctx.lineTo(Math.min(arenaRight, sx + spikeW), TOP_HEADER_H);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      /* BASE */
      const botBase = BOT_SPIKE_Y + 24;
      ctx.fillStyle = '#1c0515';
      ctx.fillRect(0, botBase, V_WIDTH, V_HEIGHT - botBase);

      ctx.fillStyle = '#8a0f43';
      ctx.strokeStyle = '#ff2a78';
      ctx.lineWidth = 2.2;

      ctx.beginPath();
      ctx.moveTo(arenaLeft, botBase);
      for (let i = 0; i < arenaSpikeCount; i++) {
        const sx = arenaLeft + i * spikeW;
        ctx.lineTo(sx + spikeW / 2, BOT_SPIKE_Y);
        ctx.lineTo(Math.min(arenaRight, sx + spikeW), botBase);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      /* ESPINHOS LATERAIS */
      const renderSpikes = (side, slots) => {
        if (slots.length === 0) return;
        ctx.fillStyle = '#8a0f43';
        ctx.strokeStyle = '#ff2a78';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let i = 0; i < slots.length; i++) {
          const slot = slots[i];
          const y1 = TOP_SPIKE_Y + slot * SLOT_HEIGHT;
          const y2 = y1 + SLOT_HEIGHT;
          const midY = (y1 + y2) / 2;
          if (side === 'left') {
            ctx.moveTo(leftWallX, y1);
            ctx.lineTo(leftWallX + SPIKE_DEPTH, midY);
            ctx.lineTo(leftWallX, y2);
          } else {
            ctx.moveTo(rightWallX, y1);
            ctx.lineTo(rightWallX - SPIKE_DEPTH, midY);
            ctx.lineTo(rightWallX, y2);
          }
        }
        ctx.fill();
        ctx.stroke();
      };

      renderSpikes('left', leftSpikeSlots);
      renderSpikes('right', rightSpikeSlots);

      /* ESTRELA COLETÁVEL */
      if (gem) {
        const gemRealX = leftWallX + gem.relX * (rightWallX - leftWallX);
        const gemRealY = TOP_SPIKE_Y + 40 + gem.relY * (BOT_SPIKE_Y - TOP_SPIKE_Y - 80) + Math.sin(gem.floatTime) * 3.5;
        drawCuteStar(gemRealX, gemRealY, gem.size, 0);
      }

      /* PARTÍCULAS */
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;

      /* JOGADOR */
      if (state !== 'GAMEOVER' && state !== 'START') {
        if (player.trail.length > 1) {
          ctx.strokeStyle = '#ffd700';
          ctx.lineCap = 'round';
          for (let i = 0; i < player.trail.length - 1; i++) {
            const p1 = player.trail[i];
            const p2 = player.trail[i + 1];
            ctx.globalAlpha = (1 - i / player.trail.length) * 0.55;
            ctx.lineWidth = 6 * (1 - i / player.trail.length);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
          ctx.globalAlpha = 1.0;
        }

        const tilt = (state === 'READY') ? 0 : (player.vx * 0.04 + player.vy * 0.03);
        drawCuteStar(player.x, player.y, player.radius, tilt);
      }

      ctx.restore();
    }

    function mainLoop(currentFrameTime) {
      if (platformPaused || userPaused || state === 'PAUSED') {
        animFrameId = null;
        return;
      }

      let delta = (currentFrameTime - lastFrameTime) / 1000;
      lastFrameTime = currentFrameTime;

      if (delta > MAX_ACCUMULATOR) delta = MAX_ACCUMULATOR;
      physicsAccumulator += delta;

      while (physicsAccumulator >= FIXED_STEP) {
        tickFixedPhysics();
        physicsAccumulator -= FIXED_STEP;
      }

      render();
      animFrameId = requestAnimationFrame(mainLoop);
    }

    /* ==========================================================================
       PASSO 4: CICLO DE VIDA E NOTIFICAÇÕES (FIRST FRAME & GAME READY)
       ========================================================================== */
    async function initPlayable() {
      resizeCanvas();
      updateScreensUI();
      render();

      if (typeof ytgame !== 'undefined' && ytgame.game?.firstFrameReady) {
        try {
          ytgame.game.firstFrameReady();
        } catch (e) {
          console.warn('firstFrameReady:', e);
        }
      }

      if (typeof ytgame !== 'undefined' && ytgame.system) {
        if (typeof ytgame.system.isAudioEnabled === 'function') {
          try {
            audio.setAudioEnabled(ytgame.system.isAudioEnabled());
          } catch (e) {
            console.warn('isAudioEnabled:', e);
          }
        }

        if (typeof ytgame.system.onAudioEnabledChange === 'function') {
          try {
            ytgame.system.onAudioEnabledChange((enabled) => {
              audio.setAudioEnabled(enabled);
            });
          } catch (e) {
            console.warn('onAudioEnabledChange:', e);
          }
        }

        if (typeof ytgame.system.onPause === 'function') {
          ytgame.system.onPause(() => {
            pausarLogicaJogo('system');
            if (score > bestScore) {
              saveHighScore(score);
            }
          });
        }

        if (typeof ytgame.system.onResume === 'function') {
          ytgame.system.onResume(() => {
            retomarLogicaJogo('system');
          });
        }
      }

      lastFrameTime = performance.now();
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(mainLoop);
      }

      await loadSavedData();

      if (typeof ytgame !== 'undefined' && ytgame.game?.gameReady) {
        try {
          ytgame.game.gameReady();
        } catch (e) {
          console.warn('gameReady:', e);
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPlayable);
    } else {
      initPlayable();
    }
  </script>
</body>
</html>
